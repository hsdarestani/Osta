services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bavaan
      POSTGRES_USER: bavaan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - bavaan_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bavaan"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "127.0.0.1:3088:3000"
volumes:
  bavaan_db:
